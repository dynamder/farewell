name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Keep in step with build.zig.zon's minimum_zig_version.
  ZIG_VERSION: 0.17.0

jobs:
  inkmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a table that drifted from its generator: the recorded script
      # hash and parameters must still match. Needs no font and no Zig.
      - name: glyph tables match their generator
        run: |
          for grid in 8x8 8x16; do
            python3 tools/inkmap.py --check --grid "$grid" \
              --out "src/ink-ascii-$grid.zig" --cell 10x20 --size 16
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: format
        run: zig fmt --check build.zig src demo

      - name: test
        run: zig build test

      - name: build demo
        run: zig build -Doptimize=ReleaseFast
